# ---------------------------------------------------------------------------
# INA postaje – nginx vhost for CloudPanel (paste into: Sites → <site> → Vhost, replace all).
# On plain nginx: replace the {{…}} placeholders with your own certificate, root, logs and PHP-FPM socket.
#
# Works with CloudPanel's DEFAULT Root Directory (the domain folder = this repo).
# WHITELIST: nginx serves only the site's own pages, assets and the two admin PHP
# entry points. Everything else in the folder – app/, sql/, .git, README, and any
# forgotten backup (*.zip, *.sql, config_copy.php, _copy.htaccess, …) – is a 404.
#
# CloudPanel: Site type "PHP", PHP 8.3, Varnish cache OFF.
# Replace postaje.example.hr below with your domain.
# Keep the {{…}} placeholders – CloudPanel fills them in (certificate, root, logs, PHP-FPM port).
# ---------------------------------------------------------------------------

# Brute-force brake for the admin: only POSTs (login, 2FA code, saves) are limited.
# An empty key is not counted, so normal page loads are never throttled.
map $request_method $inapostaje_post_key {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $inapostaje_post_key zone=inapostaje_admin:1m rate=30r/m;

# BUNNY CDN origin lock – uncomment together with the BUNNY block in the server below
# (README, "Behind Bunny CDN"). CHANGE-ME = the secret Bunny sends in X-Inapostaje-Origin.
#map $http_x_inapostaje_origin $inapostaje_secret_ok {
#  "CHANGE-ME" 1;
#  default 0;
#}
#map $uri $inapostaje_acme {
#  ~^/\.well-known/acme-challenge/ 1;
#  default 0;
#}
#map "$inapostaje_secret_ok$inapostaje_acme" $inapostaje_blocked {
#  "00" 1;
#  default 0;
#}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.postaje.example.hr;
  return 301 https://postaje.example.hr$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name postaje.example.hr;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  # --- BUNNY CDN (optional) – see "Behind Bunny CDN" in README.md --------------
  # Uncomment these lines AND the three maps at the top of this file only AFTER Bunny sends
  # the X-Inapostaje-Origin header (Bunny edge rule "Set Request Header"), with the same secret
  # in place of CHANGE-ME. Then:
  #  * a request that did not come through Bunny gets 403 (except Let's Encrypt renewals),
  #    so nobody can skip the CDN or fake their IP address;
  #  * nginx takes the visitor's real IP from X-Forwarded-For – the LAST address, the one
  #    Bunny adds (a visitor can put anything in front of it) – so the admin lockout and
  #    the rate limit count real visitors, not Bunny servers. Keep 'trust_proxy' => false.
  #if ($inapostaje_blocked) { return 403; }
  #set_real_ip_from 0.0.0.0/0;
  #set_real_ip_from ::/0;
  #real_ip_header X-Forwarded-For;
  #real_ip_recursive off;

  # Let's Encrypt renewals (CloudPanel).
  location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    allow all;
    try_files $uri =404;
  }

  {{settings}}

  charset utf-8;
  server_tokens off;
  error_page 404 /404.html;

  # --- Compression -----------------------------------------------------------
  # The CMS writes index.html.gz, stations.json.gz, site.css.gz … on every save;
  # gzip_static sends those directly (level 9, zero CPU per request).
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # No open_file_cache here on purpose: the CMS swaps files atomically on every save,
  # and a cached file handle would keep serving the old page for up to a minute.

  # --- Public static site (whitelist) ------------------------------------------
  # Security headers live here, not at server level, so PHP responses keep only the
  # stricter headers PHP sends itself. Nested locations without add_header inherit them.
  location / {
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # geolocation=(self): "Najbliže meni" asks the browser for the position; it never leaves the page.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # (No `return` at this level: nested blocks would inherit it. The catch-all is
    # the LAST nested regex below – nginx uses the first regex that matches.)

    # Pages are regenerated by the CMS: always revalidate (cheap 304 via ETag).
    location = / {
      expires -1;
      try_files /index.html =404;
    }
    # /privatnost and /kolacici (the original URLs) and their .html forms.
    location ~ ^/(?:index|privatnost|kolacici|404)(?:\.html)?$ {
      expires -1;
      try_files $uri $uri.html =404;
    }
    location = /data/stations.json {
      expires -1;
      try_files $uri =404;
    }
    location = /robots.txt {
      expires 1d;
      try_files $uri =404;
    }
    location ~ ^/(?:favicon\.svg|favicon\.png|apple-touch-icon\.png)$ {
      expires 7d;
      access_log off;
      try_files $uri =404;
    }
    # CSS/JS URLs carry ?v=<content hash>, so they can be cached for a year and
    # never revalidated (immutable). Page headers are not needed on CSS/JS.
    location ~ ^/assets/(?:css|js)/[\w.-]+\.(?:css|js)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff";
      access_log off;
      try_files $uri =404;
    }
    # Whitelist end: anything else in the folder (backups, app/, sql/, .git, …) does not exist.
    location ~ "" {
      return 404;
    }
  }

  # --- Hidden admin (PHP) ------------------------------------------------------
  location = /customer-gas-updater {
    return 301 /customer-gas-updater/;
  }
  location ^~ /customer-gas-updater/ {
    # The admin entry URL itself → index.php (internal, the address bar stays /customer-gas-updater/).
    location = /customer-gas-updater/ {
      rewrite ^ /customer-gas-updater/index.php last;
    }
    location ~ ^/customer-gas-updater/(?:index|api)\.php$ {
      limit_req zone=inapostaje_admin burst=15 nodelay;
      limit_req_status 429;
      include fastcgi_params;
      fastcgi_intercept_errors off;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      try_files $uri =404;
      fastcgi_read_timeout 60;
      fastcgi_send_timeout 60;
      fastcgi_param HTTPS "on";
      fastcgi_param SERVER_PORT 443;
      fastcgi_pass 127.0.0.1:{{php_fpm_port}};
      fastcgi_param PHP_VALUE "{{php_settings}}";
    }
    location ~ ^/customer-gas-updater/assets/[\w.-]+\.(?:css|js)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff";
      access_log off;
      try_files $uri =404;
    }
    # Anything else under /customer-gas-updater/ (other .php, dotfiles, …) does not exist.
    location ~ "" {
      return 404;
    }
  }
}
